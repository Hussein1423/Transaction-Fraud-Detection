services:
  postgres:
    image: postgres:17
    container_name: transaction-fraud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: TFDDB
      POSTGRES_USER: tfduser
      POSTGRES_PASSWORD: ${PostgresPassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
