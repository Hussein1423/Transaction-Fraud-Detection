
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: TFDDB_Test
          POSTGRES_USER: tfduser
          POSTGRES_PASSWORD: ${{ secrets.TFD_TEST_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tfduser -d TFDDB_Test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TFD_TEST_DB_PASSWORD: ${{ secrets.TFD_TEST_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Transaction-Fraud-Detection-Test/Transaction-Fraud-Detection-Test.csproj

      - name: Build API
        run: dotnet build Transaction-Fraud-Detection-API/Transaction-Fraud-Detection-API.csproj --configuration Release --no-restore

      - name: Build Test Project
        run: dotnet build Transaction-Fraud-Detection-Test/Transaction-Fraud-Detection-Test.csproj --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test Transaction-Fraud-Detection-Test/Transaction-Fraud-Detection-Test.csproj --configuration Release --no-build --no-restore
